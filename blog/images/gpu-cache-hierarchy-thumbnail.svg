<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="50%" stop-color="#0d1318"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glowTeal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cache level gradients -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8b923" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#e8b923" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8b923" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ff6b6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(45, 212, 191, 0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Decorative circuit lines -->
  <g stroke="rgba(45, 212, 191, 0.15)" stroke-width="1" fill="none">
    <path d="M 0 100 L 100 100 L 120 120 L 120 200"/>
    <path d="M 800 350 L 700 350 L 680 330 L 680 250"/>
    <path d="M 50 450 L 50 380 L 80 350"/>
    <path d="M 750 0 L 750 70 L 720 100"/>
  </g>

  <!-- Memory Hierarchy Pyramid - Left side -->
  <g transform="translate(200, 90)">
    <!-- L1 Cache - Top -->
    <rect x="-50" y="0" width="100" height="45" rx="6" fill="url(#tealGrad)" stroke="#2dd4bf" stroke-width="2" filter="url(#glowTeal)"/>
    <text x="0" y="20" text-anchor="middle" fill="#2dd4bf" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold">L1 CACHE</text>
    <text x="0" y="35" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="9">~25 cycles</text>

    <!-- L2 Cache - Middle -->
    <rect x="-80" y="55" width="160" height="45" rx="6" fill="url(#goldGrad)" stroke="#e8b923" stroke-width="2" filter="url(#glowGold)"/>
    <text x="0" y="75" text-anchor="middle" fill="#e8b923" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold">L2 CACHE</text>
    <text x="0" y="90" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="9">~150 cycles</text>

    <!-- VRAM - Bottom -->
    <rect x="-120" y="110" width="240" height="50" rx="6" fill="url(#redGrad)" stroke="#ff6b6b" stroke-width="2" filter="url(#glowRed)"/>
    <text x="0" y="132" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">VRAM</text>
    <text x="0" y="148" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="JetBrains Mono, monospace" font-size="9">~600 cycles</text>
  </g>

  <!-- Data flow arrows -->
  <g stroke="#2dd4bf" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 200 95 L 200 85 L 200 75" stroke-dasharray="4,2"/>
    <circle cx="200" cy="70" r="4" fill="#2dd4bf"/>
  </g>

  <!-- Cache line visualization - Right side -->
  <g transform="translate(550, 100)">
    <!-- 8x4 grid representing texture/cache -->
    <g>
      <!-- Row 1 -->
      <rect x="0" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="25" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="50" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="75" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="100" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="125" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="150" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="175" y="0" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>

      <!-- Row 2 - with highlighted cache line -->
      <rect x="0" y="25" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="25" y="25" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <!-- Cache line highlight -->
      <rect x="50" y="25" width="22" height="22" rx="2" fill="rgba(232, 185, 35, 0.5)" stroke="#e8b923" stroke-width="1.5"/>
      <rect x="75" y="25" width="22" height="22" rx="2" fill="rgba(232, 185, 35, 0.5)" stroke="#e8b923" stroke-width="1.5"/>
      <rect x="100" y="25" width="22" height="22" rx="2" fill="rgba(232, 185, 35, 0.5)" stroke="#e8b923" stroke-width="1.5"/>
      <rect x="125" y="25" width="22" height="22" rx="2" fill="rgba(232, 185, 35, 0.5)" stroke="#e8b923" stroke-width="1.5"/>
      <rect x="150" y="25" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="175" y="25" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>

      <!-- Row 3 -->
      <rect x="0" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="25" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="50" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="75" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="100" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="125" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="150" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="175" y="50" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>

      <!-- Row 4 -->
      <rect x="0" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="25" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="50" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="75" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="100" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="125" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="150" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
      <rect x="175" y="75" width="22" height="22" rx="2" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="0.5"/>
    </g>

    <!-- Sample point -->
    <circle cx="86" cy="36" r="5" fill="#fff" filter="url(#glowTeal)"/>

    <!-- Cache line bracket -->
    <path d="M 50 20 L 50 12 L 147 12 L 147 20" stroke="#e8b923" stroke-width="2" fill="none"/>
    <text x="98" y="6" text-anchor="middle" fill="#e8b923" font-family="JetBrains Mono, monospace" font-size="8">CACHE LINE</text>
  </g>

  <!-- Title -->
  <text x="400" y="300" text-anchor="middle" fill="#ffffff" font-family="Outfit, sans-serif" font-size="36" font-weight="700" letter-spacing="1">GPU Cache Hierarchy</text>

  <!-- Subtitle -->
  <text x="400" y="340" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Outfit, sans-serif" font-size="18">L1, L2, VRAM &amp; Texture Fetch Optimization</text>

  <!-- Stats bar -->
  <g transform="translate(400, 390)">
    <rect x="-180" y="-15" width="360" height="30" rx="15" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>

    <text x="-120" y="5" text-anchor="middle" fill="#2dd4bf" font-family="JetBrains Mono, monospace" font-size="11">HIT: ~25 cycles</text>
    <line x1="-40" y1="-8" x2="-40" y2="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="40" y="5" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="11">MISS: ~600 cycles</text>
    <line x1="120" y1="-8" x2="120" y2="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="150" y="5" text-anchor="middle" fill="#e8b923" font-family="JetBrains Mono, monospace" font-size="11">20x</text>
  </g>

  <!-- Corner accent -->
  <path d="M 0 0 L 60 0 L 0 60 Z" fill="rgba(45, 212, 191, 0.1)"/>
  <path d="M 800 450 L 740 450 L 800 390 Z" fill="rgba(255, 107, 107, 0.1)"/>
</svg>