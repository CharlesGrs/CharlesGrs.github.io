<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="50%" stop-color="#0d1318"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glowTeal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowWhite" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sphere gradients -->
    <radialGradient id="sphereGradGold" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f4d03f"/>
      <stop offset="40%" stop-color="#e8b923"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>

    <radialGradient id="sphereGradTeal" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="40%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d6a5c"/>
    </radialGradient>

    <radialGradient id="sphereGradSmall" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>

    <!-- Hit zone gradient -->
    <radialGradient id="hitZoneGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(45, 212, 191, 0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Decorative circuit lines -->
  <g stroke="rgba(45, 212, 191, 0.15)" stroke-width="1" fill="none">
    <path d="M 0 80 L 80 80 L 100 100 L 100 180"/>
    <path d="M 800 370 L 720 370 L 700 350 L 700 280"/>
    <path d="M 40 450 L 40 400 L 70 370"/>
    <path d="M 760 0 L 760 50 L 730 80"/>
  </g>

  <!-- Screen frame representation -->
  <g transform="translate(400, 130)">
    <!-- Screen border -->
    <rect x="-280" y="-80" width="560" height="200" rx="8" fill="none" stroke="rgba(45, 212, 191, 0.3)" stroke-width="2"/>
    <text x="0" y="-95" text-anchor="middle" fill="rgba(45, 212, 191, 0.6)" font-family="JetBrains Mono, monospace" font-size="10">SCREEN SPACE</text>

    <!-- Large sphere (near) with hit zone -->
    <circle cx="-140" cy="20" r="60" fill="url(#hitZoneGrad)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" stroke-dasharray="6,4"/>
    <circle cx="-140" cy="20" r="35" fill="url(#sphereGradGold)" filter="url(#glowGold)"/>
    <text x="-140" y="70" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="9">Near (35px)</text>

    <!-- Medium sphere -->
    <circle cx="60" cy="40" r="45" fill="url(#hitZoneGrad)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" stroke-dasharray="6,4"/>
    <circle cx="60" cy="40" r="22" fill="url(#sphereGradTeal)" filter="url(#glowTeal)"/>
    <text x="60" y="80" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="9">Mid (22px)</text>

    <!-- Small sphere (far) with expanded hit zone - SELECTED -->
    <circle cx="200" cy="-10" r="40" fill="url(#hitZoneGrad)" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="200" cy="-10" r="10" fill="url(#sphereGradSmall)" filter="url(#glowTeal)"/>
    <text x="200" y="45" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="JetBrains Mono, monospace" font-size="9">Far (10px)</text>

    <!-- Mouse cursor pointing at small sphere -->
    <g transform="translate(215, 5)">
      <path d="M 0 0 L 0 18 L 5 14 L 9 22 L 12 20 L 8 12 L 14 12 Z" fill="#ffffff" filter="url(#glowWhite)"/>
    </g>

    <!-- Distance line from cursor to sphere center -->
    <line x1="215" y1="5" x2="200" y2="-10" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="220" y="-15" text-anchor="start" fill="#2dd4bf" font-family="JetBrains Mono, monospace" font-size="10">d &lt; hitRadius</text>

    <!-- Selection indicator ring -->
    <circle cx="200" cy="-10" r="15" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.8"/>
    <circle cx="200" cy="-10" r="20" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Raycast miss illustration (left side, faded) -->
  <g transform="translate(80, 160)" opacity="0.5">
    <!-- Camera eye -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ff6b6b"/>

    <!-- Missed ray -->
    <line x1="15" y1="0" x2="100" y2="-25" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="80" y="-35" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="9">Miss!</text>

    <!-- Small target sphere -->
    <circle cx="95" cy="5" r="8" fill="none" stroke="#ff6b6b" stroke-width="1"/>

    <text x="50" y="35" text-anchor="middle" fill="rgba(255,107,107,0.7)" font-family="JetBrains Mono, monospace" font-size="8">RAYCAST</text>
    <line x1="0" y1="25" x2="100" y2="25" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="400" y="305" text-anchor="middle" fill="#ffffff" font-family="Outfit, sans-serif" font-size="32" font-weight="700" letter-spacing="1">Screen-Space Sphere Selection</text>

  <!-- Subtitle -->
  <text x="400" y="340" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Outfit, sans-serif" font-size="16">Project to 2D, Measure Distance, Expand Hit Zones</text>

  <!-- Formula bar -->
  <g transform="translate(400, 390)">
    <rect x="-200" y="-15" width="400" height="30" rx="15" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>

    <text x="-130" y="5" text-anchor="middle" fill="#2dd4bf" font-family="JetBrains Mono, monospace" font-size="11">dist = |mouse - projected|</text>
    <line x1="-20" y1="-8" x2="-20" y2="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="90" y="5" text-anchor="middle" fill="#e8b923" font-family="JetBrains Mono, monospace" font-size="11">hitRadius = max(r+15, 40)</text>
  </g>

  <!-- Corner accents -->
  <path d="M 0 0 L 60 0 L 0 60 Z" fill="rgba(45, 212, 191, 0.1)"/>
  <path d="M 800 450 L 740 450 L 800 390 Z" fill="rgba(232, 185, 35, 0.1)"/>
</svg>
