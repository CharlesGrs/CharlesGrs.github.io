<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5KEDPWV47H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5KEDPWV47H');
    </script>

    <title>Noise Lab | Procedural Texture Generator</title>
    <meta name="description" content="GPU-accelerated procedural noise generator. Create tileable Perlin, Worley, FBM, and domain-warped textures with layer accumulation.">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="../../assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
    <div class="bg-vignette"></div>

    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="../index.html" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>Tools</span>
                </a>
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 32 32" fill="none">
                            <rect x="4" y="4" width="10" height="10" rx="2" fill="url(#noiseGrad1)" opacity="0.9"/>
                            <rect x="18" y="4" width="10" height="10" rx="2" fill="url(#noiseGrad2)" opacity="0.7"/>
                            <rect x="4" y="18" width="10" height="10" rx="2" fill="url(#noiseGrad3)" opacity="0.5"/>
                            <rect x="18" y="18" width="10" height="10" rx="2" fill="url(#noiseGrad4)" opacity="0.8"/>
                            <defs>
                                <linearGradient id="noiseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#f59e0b"/>
                                    <stop offset="100%" stop-color="#ef4444"/>
                                </linearGradient>
                                <linearGradient id="noiseGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#10b981"/>
                                    <stop offset="100%" stop-color="#06b6d4"/>
                                </linearGradient>
                                <linearGradient id="noiseGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#8b5cf6"/>
                                    <stop offset="100%" stop-color="#ec4899"/>
                                </linearGradient>
                                <linearGradient id="noiseGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#06b6d4"/>
                                    <stop offset="100%" stop-color="#3b82f6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <span class="logo-title">Noise Lab</span>
                        <span class="logo-version">v1.0</span>
                    </div>
                </div>
            </div>
            <div class="header-center">
                <div class="resolution-display">
                    <span class="resolution-label">Output</span>
                    <span class="resolution-value" id="resolutionValue">512 × 512</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-icon" id="randomizeBtn" title="Randomize All">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                        <polyline points="7.5 4.21 12 6.81 16.5 4.21"/>
                        <polyline points="7.5 19.79 7.5 14.6 3 12"/>
                        <polyline points="21 12 16.5 14.6 16.5 19.79"/>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                        <line x1="12" y1="22.08" x2="12" y2="12"/>
                    </svg>
                </button>
                <button class="btn btn-primary" id="exportBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Export</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Left Sidebar - Layers -->
            <aside class="sidebar sidebar-left">
                <div class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                                <polyline points="2 17 12 22 22 17"/>
                                <polyline points="2 12 12 17 22 12"/>
                            </svg>
                            Layers
                        </h2>
                        <button class="btn btn-sm btn-ghost" id="addLayerBtn" title="Add Layer">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="layers-container" id="layersContainer">
                        <!-- Layers will be added here dynamically -->
                    </div>
                </div>

                <!-- Presets Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="14" y="14" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                            </svg>
                            Presets
                        </h2>
                    </div>
                    <div class="presets-grid" id="presetsGrid">
                        <button class="preset-btn" data-preset="clouds">
                            <span class="preset-icon">☁</span>
                            <span class="preset-name">Clouds</span>
                        </button>
                        <button class="preset-btn" data-preset="marble">
                            <span class="preset-icon">◈</span>
                            <span class="preset-name">Marble</span>
                        </button>
                        <button class="preset-btn" data-preset="cellular">
                            <span class="preset-icon">⬡</span>
                            <span class="preset-name">Cellular</span>
                        </button>
                        <button class="preset-btn" data-preset="turbulence">
                            <span class="preset-icon">⌇</span>
                            <span class="preset-name">Turbulence</span>
                        </button>
                        <button class="preset-btn" data-preset="wood">
                            <span class="preset-icon">◎</span>
                            <span class="preset-name">Wood</span>
                        </button>
                        <button class="preset-btn" data-preset="lava">
                            <span class="preset-icon">◉</span>
                            <span class="preset-name">Lava</span>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Canvas Area -->
            <section class="canvas-area">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="noiseCanvas"></canvas>
                    <div class="canvas-overlay">
                        <div class="tile-grid" id="tileGrid"></div>
                    </div>
                    <!-- Zoom controls -->
                    <div class="canvas-controls">
                        <button class="canvas-ctrl-btn" id="zoomOutBtn" title="Zoom Out">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button class="canvas-ctrl-btn" id="zoomInBtn" title="Zoom In">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="11" y1="8" x2="11" y2="14"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </button>
                        <div class="ctrl-divider"></div>
                        <button class="canvas-ctrl-btn" id="tilePreviewBtn" title="Toggle Tile Preview">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="14" y="14" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Histogram -->
                <div class="histogram-panel">
                    <div class="histogram-header">
                        <span class="histogram-title">Histogram</span>
                        <div class="histogram-stats">
                            <span class="stat"><span class="stat-label">Min:</span> <span id="histMin">0</span></span>
                            <span class="stat"><span class="stat-label">Max:</span> <span id="histMax">255</span></span>
                            <span class="stat"><span class="stat-label">Avg:</span> <span id="histAvg">128</span></span>
                        </div>
                    </div>
                    <canvas id="histogramCanvas" width="256" height="60"></canvas>
                </div>
            </section>

            <!-- Right Sidebar - Parameters -->
            <aside class="sidebar sidebar-right">
                <div class="panel" id="layerParamsPanel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                            Layer Parameters
                        </h2>
                    </div>
                    <div class="params-container" id="paramsContainer">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                                <polyline points="2 17 12 22 22 17"/>
                                <polyline points="2 12 12 17 22 12"/>
                            </svg>
                            <p>Add a layer to start</p>
                        </div>
                    </div>
                </div>

                <!-- Output Settings -->
                <div class="panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            Output
                        </h2>
                    </div>
                    <div class="params-container">
                        <!-- Resolution -->
                        <div class="param-group">
                            <label class="param-label">Resolution</label>
                            <div class="resolution-buttons">
                                <button class="res-btn" data-res="256">256</button>
                                <button class="res-btn active" data-res="512">512</button>
                                <button class="res-btn" data-res="1024">1024</button>
                                <button class="res-btn" data-res="2048">2048</button>
                            </div>
                        </div>

                        <!-- Seamless Toggle -->
                        <div class="param-group">
                            <label class="param-label">Seamless Tiling</label>
                            <div class="toggle-row">
                                <label class="toggle">
                                    <input type="checkbox" id="seamlessToggle" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="toggle-label">Enable tileable output</span>
                            </div>
                        </div>

                        <!-- Format -->
                        <div class="param-group">
                            <label class="param-label">Export Format</label>
                            <div class="format-buttons">
                                <button class="format-btn active" data-format="png">PNG</button>
                                <button class="format-btn" data-format="jpg">JPG</button>
                                <button class="format-btn" data-format="webp">WebP</button>
                            </div>
                        </div>

                        <!-- Channels -->
                        <div class="param-group">
                            <label class="param-label">Color Mode</label>
                            <div class="format-buttons">
                                <button class="channel-btn active" data-channel="grayscale">Grayscale</button>
                                <button class="channel-btn" data-channel="rgb">RGB</button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Status Bar -->
        <footer class="statusbar">
            <div class="status-left">
                <span class="status-item">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    <span id="gpuInfo">WebGL 2.0</span>
                </span>
                <span class="status-divider">|</span>
                <span class="status-item" id="renderTime">0.0ms</span>
            </div>
            <div class="status-center">
                <span class="status-item" id="statusMessage">Ready</span>
            </div>
            <div class="status-right">
                <span class="status-item">
                    <span id="layerCount">0</span> layers
                </span>
                <span class="status-divider">|</span>
                <span class="status-item">
                    Seed: <span id="seedValue">0</span>
                </span>
            </div>
        </footer>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Export Texture</h3>
                <button class="modal-close" id="closeModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="export-preview">
                    <canvas id="exportPreviewCanvas"></canvas>
                </div>
                <div class="export-options">
                    <div class="export-option">
                        <label>Filename</label>
                        <input type="text" id="exportFilename" value="noise_texture" class="input">
                    </div>
                    <div class="export-info">
                        <span><strong>Size:</strong> <span id="exportSize">512 × 512</span></span>
                        <span><strong>Format:</strong> <span id="exportFormat">PNG</span></span>
                        <span><strong>Seamless:</strong> <span id="exportSeamless">Yes</span></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="cancelExport">Cancel</button>
                <button class="btn btn-primary" id="confirmExport">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="shaders.js"></script>
    <script src="noise-algorithms.js"></script>
    <script src="renderer.js"></script>
    <script src="layers.js"></script>
    <script src="presets.js"></script>
    <script src="app.js"></script>
</body>
</html>
